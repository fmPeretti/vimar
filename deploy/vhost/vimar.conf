# Vhost de Vimar — lo consume el reverse proxy compartido (stack `edge`).
# El proxy monta este directorio en /etc/nginx/vhosts/vimar (read-only)
# y lo incluye dentro de su bloque http { }.
#
# Upstream: alias `vimar-web` en la red docker `edge`.
# SQLite vive solo dentro del container (bind mount a disco persistente), no
# expuesto — no hay una API ni una base separadas que proteger aparte de esto.

limit_req_zone $binary_remote_addr zone=vimar_web:10m rate=20r/s;

server {
    listen 80;
    server_name vimar.amiiboexplorer.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name vimar.amiiboexplorer.com;

    ssl_certificate /etc/letsencrypt/live/vimar.amiiboexplorer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vimar.amiiboexplorer.com/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        limit_req zone=vimar_web burst=40 nodelay;

        # `set` + resolver: nginx re-resuelve el upstream en runtime, así un
        # redeploy del container no deja el proxy sirviendo 502.
        set $upstream "vimar-web:3000";
        proxy_pass http://$upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
